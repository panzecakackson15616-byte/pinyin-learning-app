<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#A66CFF">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼音乐园">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>小语老师 - 拼音学习乐园</title>
<script src="chars.js?v=20260727"></script>
<style>
:root {
  --c-pink: #FF6B8A;
  --c-blue: #5B9BD5;
  --c-green: #6BCB77;
  --c-yellow: #FFD93D;
  --c-orange: #FF8C42;
  --c-purple: #A66CFF;
  --c-bg: #F0F4FF;
  --c-card: #FFFFFF;
  --c-text: #2D3436;
  --c-sub: #636E72;
  --radius: 20px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(135deg, #E8F0FE 0%, #F3E8FF 50%, #FFE8EC 100%);
  min-height:100vh; color:var(--c-text); overflow-x:hidden;
}

/* Stars background */
.stars-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.star { position:absolute; animation: twinkle 2s infinite; font-size:20px; opacity:0.6; }
@keyframes twinkle { 0%,100%{opacity:0.3; transform:scale(1)} 50%{opacity:1; transform:scale(1.3)} }

/* App Container */
.app { position:relative; z-index:1; max-width:800px; margin:0 auto; padding:10px 16px 100px; }

/* Header */
.header { text-align:center; padding:24px 0 12px; }
.header .mascot { font-size:64px; animation: bounce 2s infinite; display:inline-block; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.header h1 { font-size:28px; background:linear-gradient(135deg,var(--c-pink),var(--c-purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin:8px 0 4px; }
.header .subtitle { font-size:14px; color:var(--c-sub); }

/* Navigation Tabs */
.nav { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
.nav button {
  padding:10px 20px; border:none; border-radius:25px;
  font-size:15px; font-weight:600; cursor:pointer;
  background:var(--c-card); color:var(--c-text);
  box-shadow:var(--shadow); transition:all 0.3s;
  display:flex; align-items:center; gap:6px;
}
.nav button:hover { transform:translateY(-2px); box-shadow:0 6px 25px rgba(0,0,0,0.12); }
.nav button.active { background:var(--c-purple); color:#fff; }

/* Sections */
.section { display:none; animation: fadeIn 0.4s; }
.section.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* Cards */
.card { background:var(--c-card); border-radius:var(--radius); padding:24px; margin:16px 0; box-shadow:var(--shadow); }
.card-title { font-size:20px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* Welcome */
.welcome-banner { text-align:center; padding:30px 20px; }
.welcome-banner .big-emoji { font-size:80px; display:block; margin-bottom:16px; }
.welcome-banner h2 { font-size:26px; margin-bottom:8px; }
.welcome-banner p { color:var(--c-sub); font-size:15px; line-height:1.8; }
.feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
.feature-item { background:var(--c-bg); border-radius:16px; padding:20px 14px; text-align:center; cursor:pointer; transition:all 0.3s; }
.feature-item:hover { transform:scale(1.03); box-shadow:var(--shadow); }
.feature-item .icon { font-size:40px; display:block; margin-bottom:8px; }
.feature-item .label { font-size:15px; font-weight:600; }

/* Stage List */
.stage-list { display:flex; flex-direction:column; gap:12px; }
.stage-item { background:var(--c-card); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); cursor:pointer; transition:all 0.3s; display:flex; align-items:center; gap:14px; border:3px solid transparent; }
.stage-item:hover { transform:translateX(4px); border-color:var(--c-purple); }
.stage-item.completed { border-color:var(--c-green); }
.stage-item .stage-num { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#fff; flex-shrink:0; }
.stage-item .stage-info { flex:1; }
.stage-item .stage-title { font-size:17px; font-weight:700; }
.stage-item .stage-desc { font-size:13px; color:var(--c-sub); margin-top:4px; }
.stage-item .stage-arrow { font-size:20px; color:var(--c-sub); }

/* Lesson Detail Modal */
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; display:none; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--c-card); border-radius:var(--radius); padding:24px; max-width:700px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); position:relative; }
.modal-close { position:absolute; top:12px; right:16px; width:36px; height:36px; border-radius:50%; border:none; background:var(--c-bg); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pinyin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; margin:16px 0; }
.pinyin-card { background:var(--c-bg); border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer; transition:all 0.3s; border:2px solid transparent; position:relative; }
.pinyin-card:hover { border-color:var(--c-purple); transform:scale(1.05); }
.pinyin-card .py-text { font-size:28px; font-weight:700; color:var(--c-purple); }
.pinyin-card .py-word { font-size:13px; color:var(--c-sub); margin-top:4px; }
.pinyin-card .speak-btn { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:none; background:var(--c-blue); color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

/* Character cards */
.char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; margin:16px 0; }
.char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin:16px 0; }
.char-card { background:linear-gradient(135deg,#FFF9E6,#FFE8CC); border-radius:14px; padding:12px 8px; text-align:center; cursor:pointer; transition:all 0.25s; border:2px solid transparent; position:relative; overflow:hidden; }
.char-card:hover { border-color:var(--c-orange); transform:translateY(-3px); box-shadow:0 6px 20px rgba(255,140,66,0.2); }
.char-card .char { font-size:36px; font-weight:700; color:var(--c-orange); line-height:1.2; }
.char-card .char-emoji { font-size:20px; display:block; margin-bottom:2px; }
.char-card .char-py { font-size:14px; color:var(--c-green); margin:2px 0; font-weight:600; }
.char-card .char-words { font-size:11px; color:#999; margin:4px 0 0; line-height:1.4; }
.char-card .char-meta { font-size:10px; color:#bbb; margin-top:3px; display:flex; justify-content:center; gap:6px; }
.char-card .char-meta span { background:rgba(0,0,0,0.05); padding:1px 5px; border-radius:6px; }
.char-card .grade-tag { position:absolute; top:4px; right:6px; font-size:9px; color:#fff; background:var(--c-blue); padding:1px 5px; border-radius:6px; opacity:0.85; }
.char-card.known { border-color:#FFD700; }
.char-card.known::after { content:'⭐'; position:absolute; top:3px; left:6px; font-size:14px; }
.char-search { width:100%; padding:10px 16px; border-radius:24px; border:2px solid #eee; font-size:16px; margin-bottom:12px; outline:none; }
.char-search:focus { border-color:var(--c-blue); }
.grade-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.grade-tab { padding:6px 14px; border-radius:20px; border:2px solid #e0e0e0; background:#fff; font-size:13px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.grade-tab:hover { border-color:var(--c-blue); }
.grade-tab.active { background:var(--c-blue); color:#fff; border-color:var(--c-blue); }
.char-count { text-align:center; font-size:13px; color:var(--c-sub); margin-bottom:10px; }

/* Character Detail Panel */
.char-detail-modal { max-width:420px; padding:0; overflow:hidden; border-radius:20px; }
.detail-hero { background:linear-gradient(135deg,#FFF9E6,#FFE8CC); padding:24px 20px 20px; text-align:center; position:relative; }
.detail-emoji { font-size:40px; display:block; margin-bottom:4px; }
.detail-char { font-size:64px; font-weight:900; color:var(--c-orange); line-height:1.1; }
.detail-py { margin:8px 0 4px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
.detail-py-text { font-size:22px; font-weight:700; color:var(--c-green); }
.detail-speak-btn { padding:6px 14px; border-radius:20px; border:none; background:var(--c-green); color:#fff; font-size:14px; cursor:pointer; }
.detail-grade { display:inline-block; margin-top:8px; padding:3px 12px; border-radius:12px; background:rgba(0,0,0,0.06); font-size:13px; color:var(--c-sub); }
.detail-section { padding:16px 20px; border-bottom:1px solid #f0f0f0; }
.detail-section:last-child { border-bottom:none; }
.detail-section-title { font-size:15px; font-weight:700; color:var(--c-sub); margin-bottom:12px; }
.pinyin-breakdown { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.pb-box { background:var(--c-bg); border-radius:14px; padding:14px 18px; text-align:center; min-width:72px; border:2px solid transparent; }
.pb-initial { border-color:#A66CFF; }
.pb-final { border-color:#FF6B8A; }
.pb-tone { border-color:#5B9BD5; }
.pb-label { font-size:12px; color:var(--c-sub); margin-bottom:4px; }
.pb-value { font-size:24px; font-weight:700; }
.pb-initial .pb-value { color:#A66CFF; }
.pb-final .pb-value { color:#FF6B8A; }
.pb-tone .pb-value { color:#5B9BD5; }
.pb-plus { font-size:20px; color:#ccc; font-weight:700; }
.detail-words { display:flex; flex-wrap:wrap; gap:8px; }
.detail-word-tag { padding:8px 16px; border-radius:20px; background:var(--c-bg); font-size:18px; font-weight:600; color:var(--c-text); cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
.detail-word-tag:hover { border-color:var(--c-blue); background:#EEF0FF; }
.detail-meta-row { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.detail-meta-item { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--c-sub); }
.detail-meta-icon { font-size:18px; }

/* Exercise */
.exercise-area { text-align:center; }
.exercise-question { font-size:22px; font-weight:700; margin:20px 0; }
.exercise-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:400px; margin:0 auto; }
.exercise-option { padding:18px; border-radius:16px; border:3px solid var(--c-bg); background:var(--c-card); font-size:24px; font-weight:700; cursor:pointer; transition:all 0.3s; }
.exercise-option:hover { border-color:var(--c-purple); transform:scale(1.03); }
.exercise-option.correct { border-color:var(--c-green); background:#E8F5E9; animation:pop 0.5s; }
.exercise-option.wrong { border-color:var(--c-pink); background:#FFEBEE; animation:shake 0.5s; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.feedback { font-size:18px; margin:16px 0; min-height:32px; font-weight:600; }
.feedback.good { color:var(--c-green); }
.feedback.retry { color:var(--c-pink); }

/* Progress */
.progress-bar-bg { background:var(--c-bg); border-radius:20px; height:20px; overflow:hidden; margin:12px 0; }
.progress-bar-fill { height:100%; border-radius:20px; background:linear-gradient(90deg,var(--c-green),var(--c-blue)); transition:width 0.5s; }
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
.stat-card { background:var(--c-bg); border-radius:16px; padding:20px; text-align:center; }
.stat-card .stat-num { font-size:36px; font-weight:700; color:var(--c-purple); }
.stat-card .stat-label { font-size:13px; color:var(--c-sub); margin-top:4px; }

/* Buttons */
.btn { padding:12px 28px; border:none; border-radius:25px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background:var(--c-purple); color:#fff; }
.btn-primary:hover { background:#8B5CF6; transform:translateY(-2px); }
.btn-green { background:var(--c-green); color:#fff; }
.btn-green:hover { background:#5AAF6A; transform:translateY(-2px); }
.btn-orange { background:var(--c-orange); color:#fff; }
.btn-orange:hover { background:#E67A30; transform:translateY(-2px); }
.btn-outline { background:transparent; border:2px solid var(--c-purple); color:var(--c-purple); }
.btn-outline:hover { background:var(--c-purple); color:#fff; }
.btn-lg { padding:16px 36px; font-size:18px; border-radius:30px; }
.btn-sm { padding:8px 16px; font-size:13px; }

/* Tone practice */
.tone-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:360px; margin:16px auto; }
.tone-btn { padding:16px; border-radius:14px; border:2px solid var(--c-bg); background:var(--c-card); font-size:28px; cursor:pointer; transition:all 0.3s; }
.tone-btn:hover { border-color:var(--c-purple); transform:scale(1.05); }

/* Badge */
.badge-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:12px 0; }
.badge { width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; background:var(--c-bg); border:3px solid #E0E0E0; }
.badge.earned { border-color:var(--c-yellow); background:#FFF9E6; animation:pop 0.5s; }

/* match game */
.match-area { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin:20px 0; }
.match-col { display:flex; flex-direction:column; gap:10px; }
.match-item { padding:14px 20px; border-radius:14px; border:2px solid var(--c-bg); background:var(--c-card); font-size:18px; cursor:pointer; transition:all 0.3s; text-align:center; }
.match-item.selected { border-color:var(--c-purple); background:#F3E8FF; }
.match-item.matched { border-color:var(--c-green); background:#E8F5E9; pointer-events:none; }

/* Responsive */
@media(max-width:500px){
  .feature-grid { grid-template-columns:1fr; }
  .pinyin-grid { grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); }
  .pinyin-card .py-text { font-size:22px; }
  .exercise-options { grid-template-columns:1fr; }
  .stats-grid { grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-card { padding:12px; }
  .stat-card .stat-num { font-size:26px; }
  .nav button { padding:8px 14px; font-size:13px; }
  .match-area { flex-direction:column; align-items:center; }
  .char-detail-modal { max-width:95vw; border-radius:16px; }
  .detail-hero { padding:20px 16px 16px; }
  .detail-char { font-size:52px; }
  .pinyin-breakdown { gap:4px; }
  .pb-box { padding:10px 12px; min-width:56px; }
  .pb-value { font-size:20px; }
  .detail-word-tag { font-size:16px; padding:6px 12px; }
}

/* PWA / Mobile APP styles */
/* iOS safe area padding for standalone mode */
@supports(padding:max(0px)){
  .app { padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); padding-bottom:max(100px,env(safe-area-inset-bottom)); }
}
/* Standalone mode: hide browser chrome hints */
@media all and (display-mode:standalone){
  body { padding-top:env(safe-area-inset-top); }
}

/* Install prompt banner */
.install-banner {
  position:fixed; bottom:0; left:0; right:0;
  background:linear-gradient(135deg,#A66CFF,#FF6B8A);
  color:#fff; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
  z-index:300; display:none; align-items:center; gap:12px;
  box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  animation:slideUp 0.4s ease;
}
.install-banner.show { display:flex; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.install-banner .ib-icon { font-size:36px; flex-shrink:0; }
.install-banner .ib-text { flex:1; font-size:14px; line-height:1.5; }
.install-banner .ib-text strong { font-size:16px; }
.install-banner .ib-close { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px; opacity:0.7; }
.install-banner .ib-btn { background:#fff; color:#A66CFF; border:none; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }

/* Share button */
.share-btn {
  position:fixed; top:16px; right:16px; z-index:50;
  width:40px; height:40px; border-radius:50%;
  background:var(--c-card); border:none; cursor:pointer;
  font-size:20px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  transition:all 0.3s;
}
.share-btn:hover { transform:scale(1.1); }
.share-toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.8); color:#fff; padding:16px 28px;
  border-radius:14px; font-size:15px; z-index:400;
  animation:fadeIn 0.3s;
}

/* Mobile touch optimizations */
@media(hover:none) and (pointer:coarse){
  .stage-item, .pinyin-card, .char-card, .exercise-option, .tone-btn, .match-item {
    -webkit-tap-highlight-color:transparent;
    cursor:default;
  }
  .stage-item:active, .pinyin-card:active, .char-card:active,
  .exercise-option:active, .tone-btn:active { transform:scale(0.96); }
}
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <span class="mascot">👩‍🏫</span>
    <h1>小语老师的拼音乐园</h1>
    <p class="subtitle">拼音是工具，识字是目标 · 每天15分钟，快乐学拼音</p>
  </div>

  <!-- Share button (visible on mobile) -->
  <button class="share-btn" onclick="shareApp()" title="分享给朋友">📤</button>

  <!-- Navigation -->
  <nav class="nav" id="navBar">
    <button onclick="showSection('home')" class="active" data-section="home">🏠 首页</button>
    <button onclick="showSection('learn')" data-section="learn">📚 学拼音</button>
    <button onclick="showSection('practice')" data-section="practice">🎮 练一练</button>
    <button onclick="showSection('chars')" data-section="chars">📝 识汉字</button>
    <button onclick="showSection('progress')" data-section="progress">⭐ 我的进度</button>
  </nav>

  <!-- Home Section -->
  <section class="section active" id="section-home">
    <div class="welcome-banner">
      <span class="big-emoji">🎈</span>
      <h2>小朋友你好呀！</h2>
      <p>我是小语老师，很高兴和你一起学拼音！<br>每天坚持15分钟，8周就能掌握所有拼音啦～</p>
    </div>
    <div class="feature-grid">
      <div class="feature-item" onclick="showSection('learn')">
        <span class="icon">📚</span>
        <span class="label">学拼音</span>
      </div>
      <div class="feature-item" onclick="showSection('practice')">
        <span class="icon">🎮</span>
        <span class="label">做练习</span>
      </div>
      <div class="feature-item" onclick="showSection('chars')">
        <span class="icon">📝</span>
        <span class="label">识汉字</span>
      </div>
      <div class="feature-item" onclick="showSection('progress')">
        <span class="icon">⭐</span>
        <span class="label">看进度</span>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">💡 今日小贴士</div>
      <p style="font-size:15px;line-height:1.8" id="dailyTip">加载中...</p>
    </div>
  </section>

  <!-- Learn Section -->
  <section class="section" id="section-learn">
    <div class="card">
      <div class="card-title">📚 拼音课程（8周计划）</div>
      <p style="color:var(--c-sub);margin-bottom:12px">点击进入每一课，小语老师带你一步步学～</p>
      <div class="stage-list" id="stageList"></div>
    </div>
  </section>

  <!-- Practice Section -->
  <section class="section" id="section-practice">
    <div class="card">
      <div class="card-title">🎮 趣味练习</div>
      <p style="color:var(--c-sub);margin-bottom:16px">选一种练习方式，看看你能答对多少！</p>

// ==================== SPEECH ENGINE ====================
// 双引擎：Google TTS (音质高) + Web Speech API (后备)
// 发音策略：传汉字而非拼音，用词组提升单字发音清晰度

const GOOGLE_TTS = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=';
let _activeAudio = null;

// 给单字生成发音上下文，如"马"→"马，马上，马车"
function buildSpeakText(ch) {
  // 先从 CHAR_LIBRARY 找词语
  if (typeof CHAR_LIBRARY !== 'undefined') {
    for (const grade in CHAR_LIBRARY) {
      const found = CHAR_LIBRARY[grade].find(c => c.ch === ch);
      if (found && found.words) {
        const words = found.words.split(' ').filter(w=>w.length>=2).slice(0,2);
        return words.length ? (ch + '，' + words.join('，')) : (ch + ch);
      }
    }
  }
  return ch + ch;
}

function speak(ch, contextWords) {
  stopSpeaking();
  // 拼接语境：单字+词语，让TTS引擎有足够上下文发准音
  const text = contextWords || buildSpeakText(ch);

  // ===== 主引擎：Google TTS =====
  const url = GOOGLE_TTS + encodeURIComponent(text);
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.src = url;
  _activeAudio = audio;

  const timeoutId = setTimeout(() => {
    if (_activeAudio === audio) { _activeAudio = null; audio.pause(); audio.src=''; fallbackSpeak(text); }
  }, 5000);

  audio.onended = () => { clearTimeout(timeoutId); _activeAudio = null; };
  audio.onerror = () => { clearTimeout(timeoutId); _activeAudio = null; fallbackSpeak(text); };

  audio.play().then(() => { clearTimeout(timeoutId); })
    .catch(() => { clearTimeout(timeoutId); _activeAudio = null; fallbackSpeak(text); });
}

// ===== 后备引擎：Web Speech API =====
let _zhVoice = null;
function findZhVoice() {
  if (_zhVoice) return _zhVoice;
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  _zhVoice = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
  return _zhVoice;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { _zhVoice = null; findZhVoice(); };
}

function fallbackSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  const zhVoice = findZhVoice();
  if (zhVoice) u.voice = zhVoice;
  u.rate = 0.7;
  u.pitch = 1.0;
  u.volume = 1;
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (_activeAudio) {
    _activeAudio.pause();
    _activeAudio.src = '';
    _activeAudio = null;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

// ==================== PINYIN PARSER ====================
// 把拼音拆成 声母(initial) + 韵母(final) + 声调(tone)
const INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const TONE_MAP = {
  'ā':'1','á':'2','ǎ':'3','à':'4','a':'5',
  'ē':'1','é':'2','ě':'3','è':'4','e':'5',
  'ī':'1','í':'2','ǐ':'3','ì':'4','i':'5',
  'ō':'1','ó':'2','ǒ':'3','ò':'4','o':'5',
  'ū':'1','ú':'2','ǔ':'3','ù':'4','u':'5',
  'ǖ':'1','ǘ':'2','ǚ':'3','ǜ':'4','ü':'5',
};
const TONE_NAMES = {1:'一声 ¯',2:'二声 ˊ',3:'三声 ˇ',4:'四声 ˋ',5:'轻声'};
const TONE_GLYPHS = {1:'ˉ',2:'ˊ',3:'ˇ',4:'ˋ',5:'·'};

function parsePinyin(py) {
  // 去掉数字声调如 ma1→mā
  let raw = py.replace(/[1-5]$/,'');
  let toneNum = py.match(/([1-5])$/);
  // 找到声母
  let initial = '';
  let rest = raw;
  for (const ini of INITIALS) {
    if (raw.startsWith(ini)) { initial = ini; rest = raw.slice(ini.length); break; }
  }
  // 找声调
  let tone = '5';
  for (const ch of rest) {
    if (TONE_MAP[ch]) { tone = TONE_MAP[ch]; break; }
  }
  // 如果py末尾有数字，用数字的声调
  if (toneNum) tone = toneNum[1];
  // 无声调合并：替换带声调的韵母为基本形式
  let finalClean = rest;
  for (const [k,v] of Object.entries(TONE_MAP)) {
    if (k.length === 1 && finalClean.includes(k) && k !== k.normalize('NFD')) {
      // 只替换带声调字符
    }
  }
  return {initial: initial || '(无)', final: rest, tone: tone, toneName: TONE_NAMES[tone]||'轻声', toneGlyph: TONE_GLYPHS[tone]||'·'};
}

// ==================== LEARN: Stage List ====================
function renderStageList() {
  const list = document.getElementById('stageList');
  list.innerHTML = STAGES.map((s,i)=>{
    const done = state.completedStages[s.id];
    return `<div class="stage-item ${done?'completed':''}" onclick="openLesson(${s.id})">
      <div class="stage-num" style="background:${s.color}">${s.id}</div>
      <div class="stage-info">

        <div class="stage-desc">${s.desc}</div>
      </div>
      <div class="stage-arrow">${done?'✅':'▶'}</div>
    </div>`;
  }).join('');
}

function openLesson(stageId) {

  const modal = document.getElementById('lessonModal');
  const content = document.getElementById('lessonContent');

    <button class="modal-close" onclick="closeLesson()">✕</button>
    <h2 style="color:${s.color}">${s.week}：${s.name}</h2>
    <p style="color:var(--c-sub);margin:8px 0">${s.desc}</p>
    <div style="background:#FFF9E6;border-radius:16px;padding:16px;margin:16px 0;font-size:14px;line-height:1.8;white-space:pre-line">
      💡 <b>小语老师口诀：</b><br>${s.tips}
    </div>
    <div class="card-title">🔊 点击拼音听发音</div>
    <div class="pinyin-grid">
      ${s.pinyin.map(p=>`
        <div class="pinyin-card" onclick="speak('${p.word}')">
          <button class="speak-btn" onclick="event.stopPropagation();speak('${p.word}')">🔊</button>
          <div class="py-text">${p.py}</div>
          <div class="py-word">${p.word}</div>
        </div>
      `).join('')}
    </div>

      ${s.chars.map(c=>`
        <div class="char-card" onclick="speak('${c.ch}')">

      `).join('')}

    <div style="text-align:center;margin-top:20px">
      <button class="btn btn-green btn-lg" onclick="completeStage(${stageId})">
        ✅ 完成本课，获得 ⭐
      </button>
    </div>

}

function closeLesson() {
  document.getElementById('lessonModal').classList.remove('show');
}

function completeStage(stageId) {
  if (!state.completedStages[stageId]) {
    state.completedStages[stageId] = true;
    state.stars += 1;
    const s = STAGES.find(x=>x.id===stageId);
    if (s) s.chars.forEach(c=>{ state.knownChars[c.ch] = true; });
    saveState();
    // confetti effect via simple animation
    showReward('太棒了！获得一颗 ⭐');
  }
  closeLesson();
  renderStageList();
  renderProgress();
}

function showReward(msg) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:30px 40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.2);z-index:200;font-size:22px;font-weight:700;text-align:center;animation:pop 0.5s';
  div.innerHTML = msg;
  document.body.appendChild(div);
  setTimeout(()=>{ div.style.opacity='0'; div.style.transition='opacity 0.5s'; setTimeout(()=>div.remove(),500); },2000);
}

// ==================== PRACTICE ====================
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// Get all pinyin items across all stages
function getAllPinyinItems() {
  const items = [];
  STAGES.forEach(s=>items.push(...s.pinyin));
  return items;
}
function getAllCharItems() {
  const items = [];
  STAGES.forEach(s=>items.push(...s.chars));
  return items;
}

function startExercise(type) {
  state.currentExercise = {type, score:0, total:0, round:0, maxRounds:6};
  state.exerciseScore = 0;
  state.exerciseTotal = 0;
  nextExerciseRound();
}

function nextExerciseRound() {
  const ex = state.currentExercise;
  if (!ex) return;
  if (ex.round >= ex.maxRounds) {
    endExercise();
    return;
  }
  ex.round++;
  const area = document.getElementById('exerciseArea');
  const totalRounds = ex.maxRounds;

  if (ex.type === 'listen') {
    const items = shuffle(getAllPinyinItems());
    const correct = items[0];
    const options = shuffle([correct, items[1], items[2], items[3]].filter((v,i,a)=>a.findIndex(x=>x.py===v.py)===i));
    if (options.length < 2) { endExercise(); return; }
    area.innerHTML = `
      <p style="color:var(--c-sub);margin-bottom:8px">第 ${ex.round}/${totalRounds} 题</p>
      <div class="exercise-question">
        🔊 <button class="btn btn-primary" onclick="speak('${correct.word}')">点我听发音</button>
        <p style="margin-top:8px;font-size:16px;color:var(--c-sub)">选出你听到的拼音</p>
      </div>
      <div class="exercise-options">
        ${options.map(o=>`<button class="exercise-option" onclick="checkAnswer(this,'${o.py}','${correct.py}')">${o.py}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    `;
    // auto-speak
    setTimeout(()=>speak(correct.word), 500);
  }
  else if (ex.type === 'match') {
    // Simple matching: show initial + final, pick the right combo
    const initials = ['b','p','m','d','t','n','l','g','k','h','j','q','x'];
    const finals = ['a','o','e','i','u','ai','ei','ao','ou'];
    const init = initials[Math.floor(Math.random()*initials.length)];
    const fin = finals[Math.floor(Math.random()*finals.length)];
    const correctPy = init + fin;
    // Generate wrong options
    const wrongs = [];
    while(wrongs.length < 3) {
      const wi = initials[Math.floor(Math.random()*initials.length)];
      const wf = finals[Math.floor(Math.random()*finals.length)];
      const wp = wi + wf;
      if (wp !== correctPy && !wrongs.includes(wp)) wrongs.push(wp);
    }
    const options = shuffle([correctPy, ...wrongs]);
    area.innerHTML = `
      <p style="color:var(--c-sub);margin-bottom:8px">第 ${ex.round}/${totalRounds} 题</p>
      <div class="exercise-question">
        <span style="font-size:36px;color:var(--c-purple)">${init}</span>
        <span style="font-size:24px;margin:0 8px">+</span>
        <span style="font-size:36px;color:var(--c-blue)">${fin}</span>
        <span style="font-size:24px;margin:0 8px">=</span>
        <span style="font-size:36px">❓</span>
        <p style="margin-top:8px;font-size:16px;color:var(--c-sub)">声母和韵母拼在一起是什么？</p>
      </div>
      <div class="exercise-options">
        ${options.map(o=>`<button class="exercise-option" onclick="checkAnswer(this,'${o}','${correctPy}')">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    `;
  }
  else if (ex.type === 'char') {
    const items = shuffle(getAllCharItems());
    const correct = items[0];
    const others = [];
    for(let i=1;i<items.length && others.length<3;i++) {
      if(items[i].py !== correct.py) others.push(items[i]);
    }
    const options = shuffle([correct, ...others].filter((v,i,a)=>a.findIndex(x=>x.py===v.py)===i));
    if (options.length < 2) { endExercise(); return; }
    area.innerHTML = `
      <p style="color:var(--c-sub);margin-bottom:8px">第 ${ex.round}/${totalRounds} 题</p>
      <div class="exercise-question">
        <span style="font-size:60px;display:block;margin-bottom:12px">${correct.ch}</span>
        <p style="font-size:16px;color:var(--c-sub)">这个字的拼音是什么？</p>
      </div>
      <div class="exercise-options">
        ${options.map(o=>`<button class="exercise-option" onclick="checkAnswer(this,'${o.py}','${correct.py}')">${o.py}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    `;
  }
  else if (ex.type === 'tone') {
    const items = shuffle(getAllPinyinItems());
    const item = items[0];
    const tone = item.py.match(/[āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ]/);
    const correctTone = tone ? (['āōēīūǖ','áóéíúǘ','ǎǒěǐǔǚ','àòèìùǜ'].findIndex(g=>g.includes(tone[0]))+1) : 1;
    const tones = ['第一声 ¯','第二声 ˊ','第三声 ˇ','第四声 ˋ'];
    area.innerHTML = `
      <p style="color:var(--c-sub);margin-bottom:8px">第 ${ex.round}/${totalRounds} 题</p>
      <div class="exercise-question">
        <span style="font-size:48px;color:var(--c-purple);display:block;margin-bottom:12px">${item.py}</span>
        <p style="font-size:16px;color:var(--c-sub)">这是第几声？</p>
      </div>
      <div class="tone-grid">
        ${tones.map((t,i)=>`<button class="tone-btn" onclick="checkAnswer(this,'${i+1}','${correctTone}')">${t}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    `;
    setTimeout(()=>speak(item.word), 400);
  }
}

function checkAnswer(el, chosen, correct) {
  const fb = document.getElementById('feedback');
  const allOpts = el.parentElement.querySelectorAll('button');
  allOpts.forEach(b=>b.disabled=true);
  const isCorrect = String(chosen) === String(correct);

  if (isCorrect) {
    el.classList.add('correct');
    state.exerciseScore++;
    fb.className = 'feedback good';
    fb.textContent = ['太棒了！🎉','答对啦！⭐','真厉害！👏','完全正确！💯'][Math.floor(Math.random()*4)];
  } else {
    el.classList.add('wrong');
    // Highlight correct answer
    allOpts.forEach(b=>{
      const val = b.onclick ? null : null;
      // highlight by matching text
    });
    fb.className = 'feedback retry';
    fb.textContent = '差一点点，正确答案是 ' + correct + '，记住它哦！💪';
  }
  state.exerciseTotal++;

  setTimeout(()=>nextExerciseRound(), 1800);
}

function endExercise() {
  const area = document.getElementById('exerciseArea');
  const pct = state.exerciseTotal > 0 ? Math.round(state.exerciseScore/state.exerciseTotal*100) : 0;
  const starEarned = pct >= 80 ? 1 : 0;
  if (starEarned) state.stars += starEarned;
  saveState();
  area.innerHTML = `
    <div style="padding:30px;text-align:center">
      <div style="font-size:60px;margin-bottom:12px">${pct>=80?'🎉':'💪'}</div>
      <div style="font-size:24px;font-weight:700;margin-bottom:8px">
        ${pct>=80?'太厉害了！':'继续加油！'}
      </div>
      <p style="font-size:18px;color:var(--c-sub);margin-bottom:8px">
        答对 ${state.exerciseScore}/${state.exerciseTotal} 题（正确率 ${pct}%）
      </p>
      ${starEarned ? '<p style="font-size:20px;color:var(--c-yellow)">获得一颗 ⭐！</p>' : '<p style="font-size:16px;color:var(--c-sub)">答对80%以上可以获得星星哦～</p>'}
      <button class="btn btn-primary btn-lg" style="margin-top:16px" onclick="startExercise(state.currentExercise.type)">🔄 再来一轮</button>
    </div>
  `;
  state.currentExercise = null;
  renderProgress();
}

// ==================== CHARACTERS ====================
let charFilterGrade = '全部';
let charSearchText = '';

function renderCharView() {
  // Build grade tabs
  const tabs = document.getElementById('gradeTabs');
  const grades = ['全部','一年级上册','一年级下册','二年级上册','二年级下册',
    '三年级上册','三年级下册','四年级上册','四年级下册',
    '五年级上册','五年级下册','六年级上册','六年级下册'];
  
  tabs.innerHTML = grades.map(g => 
    `<button class="grade-tab${charFilterGrade===g?' active':''}" onclick="setGradeFilter('${g}')">${g.replace('年级','')}</button>`
  ).join('');
  
  showFilteredChars();
}

function setGradeFilter(grade) {
  charFilterGrade = grade;
  document.querySelectorAll('.grade-tab').forEach(b => {
    b.classList.toggle('active', b.textContent === grade.replace('年级',''));
  });
  showFilteredChars();
}

function filterChars() {
  charSearchText = document.getElementById('charSearch').value.trim();
  showFilteredChars();
}

function showFilteredChars() {
  let chars = [];
  const search = charSearchText.toLowerCase();
  
  if (charFilterGrade === '全部') {
    // From ALL_CHARS (flat array with unique chars)
    if (typeof ALL_CHARS !== 'undefined') {
      // Already unique
      chars = ALL_CHARS;
    } else if (typeof CHAR_LIBRARY !== 'undefined') {
      // Build unique from CHAR_LIBRARY
      const seen = new Set();
      for (const grade in CHAR_LIBRARY) {
        CHAR_LIBRARY[grade].forEach(c => {
          if (!seen.has(c.ch)) { seen.add(c.ch); chars.push(c); }
        });
      }
    }
  } else if (typeof CHAR_LIBRARY !== 'undefined' && CHAR_LIBRARY[charFilterGrade]) {
    chars = CHAR_LIBRARY[charFilterGrade];
  }
  
  // Apply search filter
  if (search) {
    chars = chars.filter(c => 
      c.ch.includes(search) || c.py.toLowerCase().includes(search) ||
      (c.words && c.words.includes(search))
    );
  }
  
  document.getElementById('charCount').textContent = `共 ${chars.length} 个字`;
  
  const grid = document.getElementById('charGrid');
  grid.innerHTML = chars.map(c => {
    const words = c.words ? c.words.split(' ').slice(0,3).join(' ') : '';
    const radical = c.radical || '';
    const strokes = c.strokes || '';
    const emoji = c.emoji || '';
    const gradeShort = (c.grade||'').replace('年级','');
    
    let metaHtml = '';
    if (radical || strokes) {
      metaHtml = `<div class="char-meta">`;
      if (radical) metaHtml += `<span>部首:${radical}</span>`;
      if (strokes) metaHtml += `<span>${strokes}画</span>`;
      metaHtml += `</div>`;
    }
    
    return `
    <div class="char-card${state.knownChars[c.ch]?' known':''}" onclick="showCharDetail('${c.ch}')">
      ${gradeShort ? `<span class="grade-tag">${gradeShort}</span>` : ''}
      ${emoji ? `<span class="char-emoji">${emoji}</span>` : ''}
      <div class="char">${c.ch}</div>
      <div class="char-py">${c.py}</div>
      ${words ? `<div class="char-words">${words}</div>` : ''}
      ${metaHtml}
    </div>`;
  }).join('');
}

function markCharKnown(ch) {
  if (!state.knownChars[ch]) {
    state.knownChars[ch] = true;
    state.stars += 0.5;
    saveState();
    showFilteredChars(); // refresh current view
  }
}

// ==================== PROGRESS ====================
function renderProgress() {
  const total = STAGES.length;
  const done = Object.keys(state.completedStages).length;
  const pct = Math.round(done/total*100);
  document.getElementById('overallProgress').style.width = pct+'%';
  document.getElementById('progressText').textContent = '总进度 '+pct+'%（'+done+'/'+total+' 课）';
  document.getElementById('statStages').textContent = done;
  document.getElementById('statStars').textContent = Math.floor(state.stars);
  document.getElementById('statChars').textContent = Object.keys(state.knownChars).length;

  // Badges
  const badges = [
    {id:'start', emoji:'🚀', label:'启程', cond:done>=1},
    {id:'half', emoji:'🏃', label:'过半', cond:done>=4},
    {id:'full', emoji:'🏆', label:'通关', cond:done>=8},
    {id:'star5', emoji:'⭐', label:'5星', cond:state.stars>=5},
    {id:'star20', emoji:'🌟', label:'20星', cond:state.stars>=20},
    {id:'char10', emoji:'📖', label:'10字', cond:Object.keys(state.knownChars).length>=10},
    {id:'char50', emoji:'📚', label:'50字', cond:Object.keys(state.knownChars).length>=50},
  ];
  document.getElementById('badgeRow').innerHTML = badges.map(b=>`
    <div class="badge ${b.cond?'earned':''}" title="${b.label}">
      ${b.emoji}
    </div>
  `).join('');
}

function resetProgress() {
  if (confirm('确定要重置所有学习进度吗？这将清除所有星星和课程完成记录。')) {
    state = { completedStages:{}, stars:0, knownChars:{}, currentExercise:null, exerciseScore:0, exerciseTotal:0 };
    saveState();
    renderProgress();
    renderStageList();
  }
}
