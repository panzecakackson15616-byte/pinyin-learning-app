<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A66CFF"/>
      <stop offset="100%" stop-color="#FF6B8A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="512" height="256" rx="100" fill="url(#shine)"/>
  <!-- Book icon -->
  <g transform="translate(256,210)">
    <rect x="-80" y="-70" width="72" height="128" rx="8" fill="white" opacity="0.95"/>
    <rect x="-4" y="-70" width="72" height="128" rx="8" fill="white" opacity="0.95"/>
    <line x1="2" y1="-70" x2="2" y2="58" stroke="#A66CFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Text lines on left page -->
    <line x1="-58" y1="-34" x2="-22" y2="-34" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-64" y1="-10" x2="-18" y2="-10" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-58" y1="14" x2="-22" y2="14" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- Text lines on right page -->
    <line x1="12" y1="-34" x2="60" y2="-34" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="12" y1="-10" x2="48" y2="-10" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="12" y1="14" x2="44" y2="14" stroke="#A66CFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Pinyin label -->
  <text x="256" y="360" text-anchor="middle" font-size="48" fill="white" font-family="sans-serif" font-weight="bold" opacity="0.95">拼 音</text>
</svg>
